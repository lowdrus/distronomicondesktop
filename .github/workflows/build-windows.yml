name: Windows CI and Portable Build

on:
  push:
    branches: [main, native-windows-port, feature-v1.3, feature-v1.4.0]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: distronomicon-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Generate Cargo.lock
        run: cargo generate-lockfile

      - name: Normalize Rust formatting and lockfile
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        shell: pwsh
        run: |
          cargo fmt --all
          $changes = git status --porcelain -- Cargo.lock build.rs src
          if ($changes) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock build.rs src
            git commit -m "Normalize Rust formatting and lock dependencies"
            git push origin HEAD:$env:GITHUB_REF_NAME
          }

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings -A dead_code -A clippy::possible-missing-else -A clippy::collapsible-if

      - name: Tests
        run: cargo test --all-targets --all-features

      - name: Render real UI screenshot from application code
        shell: pwsh
        env:
          UPDATE_SNAPSHOTS: force
        run: |
          cargo test render_real_ui_for_documentation -- --ignored --nocapture
          $shot = Get-ChildItem -Path tests -Recurse -Filter 'distronomicon-desktop-real.png' | Select-Object -First 1
          if (-not $shot) { throw 'Headless UI renderer did not produce the documentation screenshot' }
          Copy-Item $shot.FullName DistronomiconDesktop-real.png -Force
          if ((Get-Item DistronomiconDesktop-real.png).Length -lt 10000) { throw 'Rendered screenshot is unexpectedly small' }

          New-Item -ItemType Directory -Force -Path assets | Out-Null
          Copy-Item DistronomiconDesktop-real.png assets\distronomicon-desktop-real.png -Force

          $readme = Get-Content README.md -Raw
          $readme = $readme.Replace('![Distronomicon Desktop v1.4](assets/distronomicon-desktop-example.svg)', '![Distronomicon Desktop v1.4](assets/distronomicon-desktop-real.png)')
          $oldText = 'A documentação agora usa **SVG vetorial escalável** para a prévia do repositório. Isso evita o aspecto quebrado/pixelado que ocorria ao ampliar o PNG antigo. O PNG histórico pode permanecer no repositório, mas não é mais a imagem principal do README.'
          $newText = 'A imagem acima é uma **captura real da interface v1.4**, renderizada automaticamente a partir do próprio código da aplicação no Windows CI. Ela substitui a prévia antiga quebrada/pixelada e é atualizada junto com a interface.'
          $readme = $readme.Replace($oldText, $newText)
          Set-Content README.md -Value $readme -Encoding utf8

      - name: Commit refreshed real screenshot and documentation
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        shell: pwsh
        run: |
          $changes = git status --porcelain -- assets/distronomicon-desktop-real.png README.md
          if ($changes) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/distronomicon-desktop-real.png README.md
            git commit -m "Refresh real application screenshot and documentation"
            git push origin HEAD:$env:GITHUB_REF_NAME
          }

      - name: Build portable release with static CRT
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release

      - name: Prepare portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item target\release\distronomicon-desktop.exe portable\DistronomiconDesktop.exe
          Copy-Item README.md portable\README.md
          Copy-Item THIRD_PARTY_NOTICES.md portable\THIRD_PARTY_NOTICES.md
          Compress-Archive -Path portable\* -DestinationPath DistronomiconDesktop-Windows-Portable.zip -Force
          if (-not (Test-Path portable\DistronomiconDesktop.exe)) { throw 'Portable EXE was not produced' }
          if ((Get-Item portable\DistronomiconDesktop.exe).Length -le 0) { throw 'Portable EXE is empty' }
          (Get-FileHash portable\DistronomiconDesktop.exe -Algorithm SHA256).Hash.ToLower() + '  DistronomiconDesktop.exe' | Set-Content SHA256SUMS.txt

      - name: Verify Windows GUI executable and embedded icon
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'portable\DistronomiconDesktop.exe').Path
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          if ($bytes.Length -lt 1024) { throw 'Executable is unexpectedly small' }
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'Missing Windows MZ executable signature' }
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe)
          if ($null -eq $icon) { throw 'Embedded Windows icon was not found' }
          $icon.Dispose()
          Write-Host "Portable Windows executable and icon validated: $($bytes.Length) bytes"

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: DistronomiconDesktop-Windows-Portable
          path: |
            portable/DistronomiconDesktop.exe
            DistronomiconDesktop-Windows-Portable.zip
            SHA256SUMS.txt
            Cargo.lock
            portable/README.md
            portable/THIRD_PARTY_NOTICES.md
            DistronomiconDesktop-real.png
          if-no-files-found: error
          retention-days: 30

      - name: Publish or refresh GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $versionLine = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
            if (-not $versionLine) { throw 'Could not read package version from Cargo.toml' }
            $version = $versionLine.Matches[0].Groups[1].Value
            $tag = "v$version"
          }

          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              DistronomiconDesktop-Windows-Portable.zip `
              portable/DistronomiconDesktop.exe `
              SHA256SUMS.txt `
              --target $env:GITHUB_SHA `
              --title "DISTROD-$tag" `
              --generate-notes
          } else {
            gh release edit $tag --title "DISTROD-$tag"
            gh release upload $tag `
              DistronomiconDesktop-Windows-Portable.zip `
              portable/DistronomiconDesktop.exe `
              SHA256SUMS.txt `
              --clobber
          }

          foreach ($legacyTag in @('v1.2.0', 'v1.2.1')) {
            gh release view $legacyTag *> $null
            if ($LASTEXITCODE -eq 0) {
              gh release edit $legacyTag --title "DISTROD-$legacyTag"
            }
          }
