[package]
name = "distronomicon-desktop"
version = "1.3.0"
edition = "2024"
license = "MIT"
description = "Lightweight native portable Windows GUI for GitHub release management"
repository = "https://github.com/lowdrus/distronomicondesktop"
build = "build.rs"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
regex = "1"
sha2 = "0.10"
fs2 = "0.4"
tar = "0.4"
flate2 = "1"
bzip2 = "0.6"
xz2 = "0.1"
zstd = "0.13"

[build-dependencies]
winres = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
opt-level = "z"
