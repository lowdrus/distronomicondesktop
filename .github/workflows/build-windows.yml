name: Windows CI and Portable Build

on:
  push:
    branches: [main, native-windows-port]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --all-targets

      - name: Build release
        run: cargo build --release

      - name: Prepare portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item target\release\distronomicon-desktop.exe portable\DistronomiconDesktop.exe
          Copy-Item README.md portable\README.md
          Copy-Item THIRD_PARTY_NOTICES.md portable\THIRD_PARTY_NOTICES.md
          if (-not (Test-Path portable\DistronomiconDesktop.exe)) { throw 'Portable executable was not created.' }
          Compress-Archive -Path portable\* -DestinationPath DistronomiconDesktop-Windows-Portable.zip -Force

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: DistronomiconDesktop-Windows-Portable
          path: |
            portable/
            DistronomiconDesktop-Windows-Portable.zip
          if-no-files-found: error
          retention-days: 30
