name: Build Windows Portable

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Windows cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-gnu

      - name: Build Windows release
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
        run: cargo build --release --target x86_64-pc-windows-gnu

      - name: Prepare portable artifact
        run: |
          mkdir -p portable
          cp target/x86_64-pc-windows-gnu/release/distronomicon-desktop.exe portable/DistronomiconDesktop.exe
          cp README.md portable/README.md
          test -s portable/DistronomiconDesktop.exe

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: DistronomiconDesktop-Windows-Portable
          path: portable/
          if-no-files-found: error
          retention-days: 30
