name: Windows CI and Portable Build

on:
  push:
    branches: [main, native-windows-port]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Format sources
        run: cargo fmt --all

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --all-targets --all-features

      - name: Build portable release with static CRT
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release

      - name: Prepare portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item target\release\distronomicon-desktop.exe portable\DistronomiconDesktop.exe
          Copy-Item README.md portable\README.md
          Copy-Item THIRD_PARTY_NOTICES.md portable\THIRD_PARTY_NOTICES.md
          Compress-Archive -Path portable\* -DestinationPath DistronomiconDesktop-Windows-Portable.zip -Force
          if (-not (Test-Path portable\DistronomiconDesktop.exe)) { throw 'Portable EXE was not produced' }
          if ((Get-Item portable\DistronomiconDesktop.exe).Length -le 0) { throw 'Portable EXE is empty' }
          (Get-FileHash portable\DistronomiconDesktop.exe -Algorithm SHA256).Hash.ToLower() + '  DistronomiconDesktop.exe' | Set-Content SHA256SUMS.txt

      - name: Verify Windows GUI executable
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path 'portable\DistronomiconDesktop.exe'))
          if ($bytes.Length -lt 1024) { throw 'Executable is unexpectedly small' }
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'Missing Windows MZ executable signature' }
          Write-Host "Portable Windows executable validated: $($bytes.Length) bytes"

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: DistronomiconDesktop-Windows-Portable
          path: |
            portable/DistronomiconDesktop.exe
            DistronomiconDesktop-Windows-Portable.zip
            SHA256SUMS.txt
            portable/README.md
            portable/THIRD_PARTY_NOTICES.md
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            DistronomiconDesktop-Windows-Portable.zip `
            portable/DistronomiconDesktop.exe `
            SHA256SUMS.txt `
            --title "Distronomicon Desktop ${{ github.ref_name }}" `
            --generate-notes
